name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 默认最小权限。CI 只需要读代码，不需要任何写权限。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # 第三方 action 一律钉 commit SHA 而非 tag —— tag 是可变的，
      # v6 可以被重新指向另一个 commit，SHA 不能。
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      # ci 而非 install：严格按 lockfile 装，不接受版本漂移。
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # 打包本身也是一道校验：版本号三处一致、manifest 引用不悬空。
      # 在 PR 上就跑，别等打了 tag 才发现。
      #
      # 🔴 **必须排在 Test 之前。** `tests/platform-boundary.test.ts` 里那批
      #    产物级断言用 `it.skipIf(!built)` 守着 —— dist/ 不存在时它们**静默跳过**。
      #    此方原先把 Test 放在前面，于是那 8 条断言在 CI 上**从来没跑过**，
      #    而它们守的是本项目最危险的跨平台差异（Firefox 包里不许出现
      #    `disable_non_proxied_udp` —— 抄过去会被接受、不报错、防护更弱）。
      #
      #    一条永远 skip 的测试比没有测试更糟：它让人以为那件事被守着。
      #    下面的 "no assertion was skipped" 那步就是为了不再依赖这个顺序被记住。
      - name: Build and package
        run: npm run package

      - name: Test
        run: npm run test

      # 顺序对了也要验一次「真的没跳过」—— 顺序是人维护的，会再被改坏。
      #
      # 已反向验证：把 dist/ 移开后这一步报出 8 条跳过，正是产物断言那批。
      - name: Assert no test was skipped
        run: |
          npx vitest run --reporter=json --outputFile=./vitest-results.json >/dev/null 2>&1 || true
          node -e '
            const r = require("./vitest-results.json");
            const skipped = r.testResults
              .flatMap((f) => f.assertionResults ?? [])
              .filter((a) => a.status === "pending" || a.status === "skipped");
            if (skipped.length > 0) {
              console.error("These assertions were skipped. Usually that means dist/ was");
              console.error("missing when the tests ran, so the bundle-level separation");
              console.error("assertions never executed:");
              for (const s of skipped) console.error("  " + s.fullName);
              process.exit(1);
            }
            console.log("no assertion was skipped");
          '
          rm -f ./vitest-results.json

      - name: Verify both archives extract and match their dist
        run: |
          # 🔴 逐个显式验，不用 glob。`lostproxy-*.zip` 会同时匹配到
          #    Chromium 与 Firefox 两个包，而 `unzip` 把第二个参数当成
          #    "要从第一个包里解出的文件名"，报 "filename not matched" ——
          #    一个看起来像损坏、实际是命令行语义的错误。此方在 v0.4.0
          #    打 tag 时正是这么让 CI 红的。
          set -euo pipefail

          check() {
            local zip="$1" dist="$2" out="$3"
            echo "--- $zip vs $dist"
            unzip -t "$zip"
            rm -rf "$out"
            mkdir -p "$out"
            unzip -q "$zip" -d "$out"
            diff -r "$dist" "$out" --exclude=LICENSE
            echo "    matches"
          }

          # 版本号从 package.json 读，避免在两处维护同一个数字。
          # 钉确切文件名的额外好处：release/ 里若留着旧版本的包也不受影响。
          VERSION=$(node -p "require('./package.json').version")

          check "release/lostproxy-v${VERSION}.zip"         dist         ./check-chromium
          check "release/lostproxy-firefox-v${VERSION}.zip" dist-firefox ./check-firefox

          rm -rf ./check-chromium ./check-firefox
          echo "both archives match their dist/"

      # 🔴 AMO 审核会重建源码包并与提交的包逐字节 diff，Mozilla 的要求是
      #    「There must be no differences」。这一步在本地就把那件事验一遍。
      #
      #    为什么值得花这二十秒：失败代价不是"CI 红了"，而是**提交被 AMO 退回**
      #    ——白等一轮审核（自动签名要 24 小时，人工审核不定），
      #    而退回的报错不会告诉你问题出在哪。
      #
      #    此方就是在"扮演一次审核员"时撞到了行尾符那个 bug：仓库没有
      #    .gitattributes，而开发机的 git 配了 core.autocrlf=true，于是
      #    `git archive` 导出 CRLF、工作区构建出 LF，4 个复制类文件
      #    diff 出差异而内容看起来完全一样。单靠读文档不会发现。
      - name: Verify the source archive reproduces the build
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")

          # 与 scripts/sign-firefox.mjs 用同一条命令产生源码包。
          git archive --format=zip -o "source-check.zip" HEAD

          rm -rf ./repro && mkdir -p ./repro
          unzip -q source-check.zip -d ./repro

          # 严格按 REVIEWERS.md 给审核员的步骤走。这一步同时校验那份
          # 说明书本身是对的 —— 一份过时的构建说明和没有说明一样糟。
          cd ./repro
          npm ci
          npm run build:firefox
          cp LICENSE dist-firefox/
          cd ..

          # ⚠️ 我们这边也要放 LICENSE。`scripts/package.mjs` 只把它塞进 zip、
          #    不写进目录，而 `scripts/sign-firefox.mjs` 会复制进去 ——
          #    所以"待签目录"里有它。这里对齐的是**签名路径**，不是打包路径。
          cp LICENSE dist-firefox/

          diff -r dist-firefox ./repro/dist-firefox
          echo "a reviewer following REVIEWERS.md reproduces dist-firefox exactly"

          rm -rf ./repro source-check.zip
